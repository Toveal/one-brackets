[package]
name = "one-brackets"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reader and writer for the 1C:Enterprise bracket format: lossless tree, positions in errors, serde mapping"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Toveal/one-brackets"
readme = "README.md"
keywords = ["1c-enterprise", "brackets", "parser", "serde", "event-log"]
categories = ["parser-implementations", "encoding"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }
thiserror = "2"

[[example]]
name = "cluster"
required-features = ["serde"]

[[example]]
name = "v8log"
required-features = ["serde"]

[[bench]]
name = "parse"
harness = false

[dev-dependencies]
criterion = "0.5"
insta = { version = "1", features = ["glob"] }
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

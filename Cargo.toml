[package]
name = "one-brackets"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for the 1C:Enterprise bracket format"

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }
thiserror = "2"

[[example]]
name = "cluster"
required-features = ["serde"]

[[example]]
name = "v8log"
required-features = ["serde"]

[[bench]]
name = "parse"
harness = false

[dev-dependencies]
criterion = "0.5"
insta = { version = "1", features = ["glob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

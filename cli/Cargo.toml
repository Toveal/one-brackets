[package]
name = "one-brackets-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line converter of 1C:Enterprise bracket files to JSON, YAML and XML and back"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Toveal/one-brackets"
readme = "README.md"
keywords = ["1c-enterprise", "brackets", "json", "yaml", "xml"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "one-brackets"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
one-brackets = { version = "0.2", path = ".." }
quick-xml = "0.41"
saphyr-parser = "0.2"

[dev-dependencies]
assert_cmd = "2.1"
insta = "1"
